name: Redesign CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [modern-academic-redesign]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: redesign-dist
          path: dist
